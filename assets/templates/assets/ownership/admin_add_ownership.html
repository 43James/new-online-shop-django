{% extends "assets/home/base_sidebar.html" %}
{% load form_tags %}

{% block content %}
<style>
    .page-header {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border-radius: 16px;
        padding: 30px 40px;
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
    }
    .page-header::after {
        content: '\f4b9';
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
        position: absolute;
        right: 30px;
        bottom: -20px;
        font-size: 8rem;
        opacity: 0.1;
        transform: rotate(-15deg);
        pointer-events: none;
    }
    .form-card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        background: white;
        overflow: hidden;
    }
    .form-section-title {
        font-size: 1rem;
        font-weight: 700;
        color: #059669;
        padding-bottom: 10px;
        margin-bottom: 20px;
        border-bottom: 2px solid #ecfdf5;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .btn-submit {
        background: linear-gradient(135deg, #10b981, #059669);
        border: none;
        color: white;
        padding: 12px 36px;
        border-radius: 50rem;
        font-weight: 700;
        font-size: 1rem;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        transition: all 0.3s;
    }
    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        color: white;
    }
    .btn-cancel {
        background: #f3f4f6;
        border: none;
        color: #6b7280;
        padding: 12px 32px;
        border-radius: 50rem;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s;
    }
    .btn-cancel:hover {
        background: #e5e7eb;
        color: #374151;
    }
</style>

<div class="container-fluid py-4 px-3 px-md-4">
    <!-- Header -->
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div style="position: relative; z-index: 1;">
            <h2 class="fw-bold mb-2"><i class="fas fa-plus-circle me-2"></i>เพิ่มสิทธิ์ผู้ครอบครองคนใหม่</h2>
            <p class="mb-0 opacity-75">แจกจ่ายครุภัณฑ์ให้บุคลากรในความดูแลของคุณ</p>
        </div>
        <div style="position: relative; z-index: 1;">
            <a href="javascript:void(0);" onclick="window.history.back();" class="btn btn-light text-success fw-bold rounded-pill shadow-sm px-4">
                <i class="fas fa-arrow-left me-2"></i>ย้อนกลับ
            </a>
        </div>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="form-card mb-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="form-section-title">
                            <i class="fas fa-user-edit"></i> กำหนดสิทธิ์ครอบครอง
                        </div>
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold" for="user_id">ผู้ครอบครอง <span class="text-danger">*</span></label>
                                <select name="user_id" class="form-select selectpicker border border-2" data-live-search="true" id="user_id" required>
                                    <option value="">-- เลือกบุคลากร --</option>
                                    {% for u in users %}
                                        <option value="{{ u.id }}">{{ u.first_name }} {{ u.last_name }} (@{{ u.username }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold" for="asset_ids">ครุภัณฑ์ที่ต้องการมอบ (เลือกได้หลายชิ้น) <span class="text-danger">*</span></label>
                                <select name="asset_ids" class="form-select selectpicker border border-2" data-live-search="true" id="asset_ids" multiple required>
                                    {% for a in assets %}
                                        <option value="{{ a.id }}">{{ a.asset_code }} - {{ a.item_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold" for="start_date">วันที่เริ่มต้น <span class="text-danger">*</span></label>
                                <input type="date" name="start_date" class="form-control border border-2" id="start_date" required>
                            </div>
                        </div>

                    </div>
                    <!-- Footer Actions -->
                    <div class="card-footer bg-light border-top-0 px-4 px-md-5 py-4">
                        <div class="d-flex justify-content-end gap-3">
                            <a onclick="history.back()" class="btn btn-cancel">
                                <i class="fas fa-times me-2"></i>ยกเลิก
                            </a>
                            <button type="submit" class="btn btn-submit"
                                onclick="this.disabled=true; this.innerHTML='<i class=\'fas fa-spinner fa-spin me-2\'></i>กำลังบันทึก...'; this.form.submit();">
                                <i class="fas fa-save me-2"></i>บันทึกสิทธิ์ครอบครอง
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
