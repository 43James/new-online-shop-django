{% extends "base_sidebar.html" %}
{% load form_tags %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <span class="fs-2">📄</span>
                        </div>
                        <h3 class="fw-bold text-dark mb-2">ยื่นคำร้องขอเคลื่อนย้าย/ส่งคืน</h3>
                        <p class="text-muted mb-0">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อส่งเรื่องให้หัวหน้างานพิจารณา</p>
                    </div>
                    
                    <hr class="text-secondary mb-4 opacity-25">

                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">
                                📦 1. เลือกครุภัณฑ์ที่ต้องการทำรายการ <span class="text-danger">*</span>
                            </label>
                            <select name="asset_id" class="selectpicker form-control border" data-live-search="true" title="-- กรุณาพิมพ์ค้นหา หรือ เลือกครุภัณฑ์ --" data-width="100%" data-size="6" required>
                                {% for asset in my_assets %}
                                    <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.item_name }}</option>
                                {% endfor %}
                            </select>
                        </div> -->

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">
                                📦 1. เลือกครุภัณฑ์ที่ต้องการทำรายการ (เลือกได้หลายรายการ) <span class="text-danger">*</span>
                            </label>
                            <select name="asset_ids" id="asset_ids" class="selectpicker form-control border" multiple data-actions-box="true" data-live-search="true" title="-- กรุณาพิมพ์ค้นหา หรือ เลือกครุภัณฑ์ --" data-width="100%" data-size="6" required>
                                {% for asset in my_assets %}
                                    <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.item_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark d-block">
                                🔄 2. ความประสงค์ <span class="text-danger">*</span>
                            </label>
                            <div class="d-flex gap-3 mt-2">
                                <input type="radio" class="btn-check" name="action_type" id="actionMove" value="MOVE" required>
                                <label class="btn btn-outline-primary px-4 py-2 fw-medium rounded-pill" for="actionMove">
                                    🚚 เคลื่อนย้ายสถานที่
                                </label>

                                <input type="radio" class="btn-check" name="action_type" id="actionReturn" value="RETURN">
                                <label class="btn btn-outline-danger px-4 py-2 fw-medium rounded-pill" for="actionReturn">
                                    🔙 ส่งคืนส่วนกลาง
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="condition" class="form-label fw-semibold text-dark">
                                ✨ 3. สภาพการใช้งานปัจจุบัน <span class="text-danger">*</span>
                            </label>
                            <select name="condition" id="condition" class="form-select form-select-lg fs-6" required>
                                <option value="" selected disabled>-- ระบุสภาพการใช้งาน --</option>
                                <option value="ใช้งานได้">✅ ใช้งานได้</option>
                                <option value="ชำรุด">🛠️ ชำรุด</option>
                                <option value="เสื่อมสภาพ">📉 เสื่อมสภาพ</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">
                                📍 4. ไปยังสถานที่ <span class="text-muted fw-normal">(กรณีเลือกเคลื่อนย้าย)</span>
                            </label>
                            <select name="transfer_to_location" id="transferLocation" class="selectpicker form-control border" data-live-search="true" title="-- ไม่ระบุ (กรณีส่งคืน) --" data-width="100%" data-size="6">
                                {% for loc in locations %}
                                    <option value="{{ loc.id }}">{{ loc.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text mt-2"><small>* หากประสงค์ส่งคืน ไม่ต้องเลือกช่องนี้</small></div>
                        </div>

                        <div class="mb-4">
                            <label for="remark" class="form-label fw-semibold text-dark">
                                📝 5. หมายเหตุ
                            </label>
                            <input type="text" name="remark" id="remark" class="form-control form-control-lg fs-6" placeholder="ระบุเหตุผล หรือ ข้อมูลเพิ่มเติม (ถ้ามี)">
                        </div>

                        <hr class="text-secondary mt-5 mb-4 opacity-25">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'assets:my_assets' %}" class="btn btn-light border px-4 fw-medium text-secondary rounded-pill">
                                ยกเลิก
                            </a>
                            <button type="submit" class="btn btn-primary px-4 fw-medium shadow-sm d-flex align-items-center gap-2 rounded-pill">
                                🚀 ยืนยันการส่งคำร้อง
                            </button>
                        </div>
                    </form>

                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('input[type=radio][name=action_type]').change(function() {
            if (this.value == 'RETURN') {
                // ถ้ากดส่งคืน ให้เคลียร์ค่าสถานที่และปิดไม่ให้เลือก
                $('#transferLocation').val('').selectpicker('refresh');
                $('#transferLocation').prop('disabled', true).selectpicker('refresh');
            } else if (this.value == 'MOVE') {
                // ถ้ากดเคลื่อนย้าย ให้เปิดช่องให้เลือกสถานที่ได้ตามปกติ
                $('#transferLocation').prop('disabled', false).selectpicker('refresh');
            }
        });
    });
</script>

{% endblock %}
