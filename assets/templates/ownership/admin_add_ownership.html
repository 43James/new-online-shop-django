{% extends "base_sidebar.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <span class="fs-2">📦</span>
                        </div>
                        <h3 class="fw-bold text-dark mb-2">บันทึกการจ่ายครุภัณฑ์</h3>
                        <p class="text-muted mb-0">ดำเนินการมอบหมายครุภัณฑ์ให้พนักงานใหม่หรือพนักงานปัจจุบัน</p>
                    </div>
                    
                    <hr class="text-secondary mb-4 opacity-25">

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="user_id" class="form-label fw-semibold text-dark">
                                👤 1. เลือกพนักงาน (ผู้ครอบครอง) <span class="text-danger">*</span>
                            </label>
                            <select name="user_id" id="user_id" class="selectpicker form-control border" data-live-search="true" title="-- กรุณาพิมพ์ค้นหาหรือเลือกชื่อพนักงาน --" data-width="100%" data-size="8" required>
                                {% for u in users %}
                                    <option value="{{ u.id }}">{{ u.first_name }} {{ u.last_name }} ({{ u.username }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="asset_ids" class="form-label fw-semibold text-dark">
                                💻 2. เลือกครุภัณฑ์ที่จะมอบหมาย (เลือกได้หลายรายการ) <span class="text-danger">*</span>
                            </label>
                            <select name="asset_ids" id="asset_ids" class="selectpicker form-control border" multiple data-actions-box="true" data-live-search="true" title="-- กรุณาพิมพ์ค้นหาหรือเลือกรหัส/ชื่อครุภัณฑ์ --" data-width="100%" data-size="8" required>
                                {% for asset in assets %}
                                    <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.item_name }} ({{ asset.damage_status }})</option>
                                {% endfor %}
                            </select>
                            <div class="form-text text-danger mt-2">
                                <small>⚠️ <strong>ข้อควรระวัง:</strong> ระบบจะตัดสิทธิ์ผู้ครอบครองคนเก่าออกโดยอัตโนมัติ หากครุภัณฑ์เหล่านี้ถูกเปลี่ยนมือ</small>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="start_date" class="form-label fw-semibold text-dark">
                                📅 3. วันที่เริ่มครอบครอง / ยืมใช้งาน <span class="text-danger">*</span>
                            </label>
                            <input type="date" name="start_date" id="start_date" class="form-control form-control-lg fs-6" required>
                        </div>

                        <hr class="text-secondary mt-5 mb-4 opacity-25">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'assets:admin_ownership_list' %}" class="btn btn-light border px-4 fw-medium text-secondary">
                                ยกเลิก
                            </a>
                            <button type="submit" class="btn btn-success px-4 fw-medium shadow-sm d-flex align-items-center gap-2">
                                💾 บันทึกข้อมูล
                            </button>
                        </div>
                    </form>

                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
